<style>
:root {
  --olive-ink:   #2f3526;
  --olive-dark:  #4a5539;

  --olive-mist:  #bfcc9e;
  --olive-haze:  #dfe8cc;
  --olive-veil:  #eef3e4;
  --cream:       #faf6ee;
  --cream-mid:   #f0ead8;
  --cream-deep:  #e4dbc8;
  --text:        #2f3526;

}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: var(--ff-body);
  background: var(--cream);
  color: var(--text);
  line-height: 1.7;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
img { display: block; width: 100%; height: 100%; object-fit: cover; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: var(--ff-body); border: none; background: none; }

body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: .028;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ─── NAV ─── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 3rem;
  transition: background .4s var(--ease-out), box-shadow .4s;
}
.nav.scrolled {
  background: rgba(250,246,238,.96);
  backdrop-filter: blur(12px);
  box-shadow: 0 1px 0 var(--rule);
}
.nav-brand {
  font-family: var(--ff-display);
  font-size: 1.4rem;
  font-weight: 400;
  letter-spacing: .04em;
  color: var(--cream);
  transition: color .4s;
  cursor: pointer;
  line-height: 1.2;
}
.nav-brand small {
  display: block;
  font-family: var(--ff-body);
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
  font-weight: 300;
  opacity: .6;
  margin-top: 2px;
}
.nav.scrolled .nav-brand { color: var(--olive-ink); }
.nav-links { display: flex; gap: 2.5rem; list-style: none; }
.nav-links a {
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  font-weight: 500;
  color: rgba(250,246,238,.75);
  padding-bottom: 2px;
  border-bottom: 1px solid transparent;
  transition: color .3s, border-color .3s;
}
.nav.scrolled .nav-links a { color: var(--text-soft); }
.nav-links a:hover,
.nav-links a.active { color: var(--olive-dark); border-color: var(--olive-soft); }
.nav.scrolled .nav-links a:hover,
.nav.scrolled .nav-links a.active { color: var(--olive-dark); }

.nav-hamburger {
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  width: 36px; height: 36px;
  padding: 0;
  cursor: pointer;
  position: relative;
}
.nav-hamburger span {
  display: block;
  width: 22px; height: 1.5px;
  background: var(--cream);
  transition: all .35s var(--ease-out);
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}
.nav-hamburger span:nth-child(1) { top: 11px; }
.nav-hamburger span:nth-child(2) { top: 17px; width: 16px; }
.nav-hamburger span:nth-child(3) { top: 23px; }
.nav.scrolled .nav-hamburger span { background: var(--olive-ink); }
.nav-hamburger.active span:nth-child(1) { top: 17px; transform: translateX(-50%) rotate(45deg); }
.nav-hamburger.active span:nth-child(2) { opacity: 0; width: 0; }
.nav-hamburger.active span:nth-child(3) { top: 17px; transform: translateX(-50%) rotate(-45deg); }

.nav-mobile {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--olive-ink);
  z-index: 99;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2.5rem;
}
.nav-mobile.open { display: flex; }
.nav-mobile a {
  font-family: var(--ff-display);
  font-size: 2.5rem;
  font-weight: 300;
  color: var(--cream);
  letter-spacing: .04em;
  transition: color .2s;
}
.nav-mobile a:hover { color: var(--olive-mist); }
.nav-mobile-close {
  position: absolute;
  top: 1.5rem; right: 2rem;
  font-size: 2rem;
  color: rgba(250,246,238,.5);
  cursor: pointer;
  background: none; border: none;
  font-family: var(--ff-body);
}

/* ─── BUTTONS ─── */
.btn {
  display: inline-block;
  font-family: var(--ff-body);
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  font-weight: 500;
  padding: .95rem 2.4rem;
  transition: all .25s var(--ease-out);
  cursor: pointer;
}
.btn-olive {
  background: var(--olive-dark);
  border: 1px solid var(--olive-dark);
  color: var(--cream);
}
.btn-olive:hover { background: var(--olive-mid); border-color: var(--olive-mid); color: var(--cream); }

/* ─── SECTIONS ─── */
.section-label {
  font-size: 11px;
  letter-spacing: .24em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--olive-mid);

}
.display-heading {

  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 300;
  line-height: 1.1;
  color: var(--olive-ink);
}
.display-heading em { font-style: italic; color: var(--olive-mid); }

/* ─── PORTFOLIO PAGE ─── */
.portfolio-hero {
  height: 720px;
  background: var(--olive-ink);
  display: flex;
  align-items: flex-end;
  padding: 3rem;
  position: relative;
  overflow: hidden;
}
.portfolio-hero-bg {
  position: absolute; inset: 0;
  background: linear-gradient(150deg, #4a5a38 0%, #6e8050 30%, #90a468 55%, #7a7858 75%, #5a5248 100%);
  opacity: .7;
}
.portfolio-hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(30,33,24,.45) 0%, rgba(30,33,24,.1) 100%);
}
.portfolio-hero-content { position: relative; z-index: 2; color: var(--cream); width: 100%; text-align: center; }

.portfolio-cats {
  background: var(--cream);
  border-bottom: 1px solid var(--rule);
  padding: 1.5rem 3rem;
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
  justify-content: center;
}
.cat-btn {
  padding: .5rem 1.4rem;
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  font-weight: 500;
  border: 1px solid var(--rule);
  background: white;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .2s;
  border-radius: 2px;
}
.cat-btn:hover { border-color: var(--olive-soft); color: var(--olive-dark); }
.cat-btn.active { background: var(--olive-dark); border-color: var(--olive-dark); color: var(--cream); }

.gallery-wrap {
  background: var(--cream-mid);
  padding: 3px;
}
.gallery-grid {
  columns: 4;
  column-gap: 3px;
}
.gallery-cell {
  overflow: hidden;
  position: relative;
  break-inside: avoid;
  margin-bottom: 3px;
}
.gallery-cell-inner {
  transition: transform .6s var(--ease-out);
  width: 100%;
  line-height: 0;
}
.gallery-cell-inner img {
  width: 100%;
  height: auto;
  display: block;
}
.gallery-cell:hover .gallery-cell-inner { transform: scale(1.04); }

/* ─── FOOTER ─── */
.footer {
  background: var(--olive-ink);
  padding: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;

.footer-brand {

.footer-links {

.footer-links a { transition: color .2s; }
.footer-links a:hover { color: rgba(250,246,238,.7); }

@media (max-width: 900px) {

  .gallery-grid { columns: 2; }
  .footer { flex-direction: column; align-items: flex-start; }
}

<script>
function setCategory(cat) {
  ['weddings','events'].forEach(c => {
    const el = document.getElementById('gallery-' + c);
    if (el) el.style.display = c === cat ? 'block' : 'none';
  });
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cat === cat);
  });
  // Update hash without triggering scroll
  if (history.replaceState) {
    history.replaceState(null, '', '#' + cat);
  }
}

function updateNav() {
  const nav = document.getElementById('mainNav');
  nav.classList.toggle('scrolled', window.scrollY > 40);
}
window.addEventListener('scroll', updateNav, { passive: true });

function toggleMobileNav() {
  const nav = document.getElementById('mobileNav');
  if (nav.classList.contains('open')) closeMobileNav();
  else openMobileNav();
}
function openMobileNav() {
  document.getElementById('mobileNav').classList.add('open');
  document.getElementById('hamburger').classList.add('active');
}
function closeMobileNav() {
  document.getElementById('mobileNav').classList.remove('open');
  document.getElementById('hamburger').classList.remove('active');
}

// Read URL hash on load to set initial category (e.g. /portfolio#events)
window.addEventListener('DOMContentLoaded', () => {
  const hash = window.location.hash.replace('#', '');
  if (hash === 'events' || hash === 'weddings') {
    setCategory(hash);
  }
});
</script>
